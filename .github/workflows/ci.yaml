name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        # bunは依存パッケージのライフサイクルスクリプトを既定で実行しない。
        # --ignore-scriptsでこのリポジトリ自身のスクリプトも走らせない。
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        # サーバーのテストがdist/client/index.htmlを読むので、テストより先にビルドする
        run: bun run build

      - name: Test
        run: bun test

      - name: Lint package contents (publint)
        run: bunx publint@0.3.24
