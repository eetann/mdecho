name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.x"
          # bun.lockしか無いのでsetup-node側のnpmキャッシュは使わない
          package-manager-cache: false

      - name: Install dependencies
        # bunは依存パッケージのライフサイクルスクリプトを既定で実行しない。
        # --ignore-scriptsでこのリポジトリ自身のスクリプトも走らせない。
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Lint package contents (publint)
        run: bunx publint@0.3.24

      - name: Verify publish contents (dry-run)
        run: npm publish --dry-run
